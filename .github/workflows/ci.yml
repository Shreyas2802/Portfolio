name: CI

# Runs on every push and PR - build + test both the backend and
# frontend, plus a dependency vulnerability check for each. This is
# CI only (build/test verification), not CD - actual deployment to
# Plesk is a separate, manual step (see
# docs/deployment/plesk-deployment-guide.md) since it needs real
# server credentials this workflow doesn't have.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Migrations match the entity model
        # Fails if an entity changed without a matching EF Core migration
        # (fresh databases would then be missing columns).
        run: |
          dotnet tool install --global dotnet-ef --version "9.0.*"
          dotnet ef migrations has-pending-model-changes \
            --project Portfolio.Infrastructure --startup-project Portfolio.Api \
            --configuration Release --no-build

      - name: Unit tests
        run: dotnet test Portfolio.Tests.Unit --no-build --configuration Release

      - name: Start Azurite (Azure Storage emulator)
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          for i in $(seq 1 30); do nc -z 127.0.0.1 10000 && exit 0; sleep 1; done
          echo "Azurite did not start" && docker logs azurite && exit 1

      - name: Integration tests
        run: dotnet test ../../tests/api-integration/Portfolio.Tests.Integration --configuration Release
        env:
          AZURITE_CONNECTION_STRING: UseDevelopmentStorage=true

      - name: Dependency vulnerability check
        # Doesn't fail the build - informational, matching this
        # project's existing manual-audit practice (Phase 7/9). Change
        # to `run: dotnet list package --vulnerable --include-transitive
        # | grep -q "has the following vulnerable packages" && exit 1
        # || exit 0` if you want this to actually fail CI on findings.
        run: dotnet list package --vulnerable --include-transitive
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Dependency vulnerability check
        run: npm audit --audit-level=high

  docker:
    # Builds the production image and runs the full stack (SQL Server,
    # Azurite, app) exactly as `docker compose up` would on a laptop, then
    # exercises it end to end: schema migrated, sample data seeded, SPA
    # served, admin login, and a real photo upload stored in Blob storage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/health && exit 0
            sleep 3
          done
          exit 1

      - name: Smoke test
        run: |
          set -euo pipefail
          BASE=http://localhost:8080

          echo "== database connected"
          curl -fsS $BASE/api/health | grep -q '"database":"connected"'

          echo "== SPA served with security headers"
          curl -fsS $BASE/ | grep -q '<div id="root">'
          curl -fsSI $BASE/ | grep -qi '^content-security-policy:.*img-src .*http://localhost:10000'

          echo "== sample data seeded"
          ALBUM_ID=$(curl -fsS $BASE/api/photography/albums | jq -r '.[0].id')
          test "$ALBUM_ID" != "null"

          echo "== admin login"
          TOKEN=$(curl -fsS -X POST $BASE/api/auth/login -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"Local-Admin-2026"}' | jq -r '.token')
          test -n "$TOKEN" && test "$TOKEN" != "null"

          echo "== upload goes to Azurite"
          UPLOAD=$(curl -fsS -X POST $BASE/api/photography/upload -H "Authorization: Bearer $TOKEN" \
            -F "file=@tests/web-e2e/fixtures/test-photo.jpg;type=image/jpeg" \
            -F "title=CI smoke test" -F "albumId=$ALBUM_ID")
          echo "$UPLOAD"
          THUMB=$(echo "$UPLOAD" | jq -r '.thumbnailUrl')
          case "$THUMB" in http://localhost:10000/devstoreaccount1/photos/*) ;; *) echo "unexpected URL: $THUMB"; exit 1;; esac
          curl -fsSI "$THUMB" | grep -qi '^content-type: image/jpeg'

          echo "== delete removes the blob"
          PHOTO_ID=$(echo "$UPLOAD" | jq -r '.id')
          curl -fsS -X DELETE $BASE/api/photography/$PHOTO_ID -H "Authorization: Bearer $TOKEN" -o /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' "$THUMB")" = "404"

          echo "All smoke tests passed"

      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
          # Also surface the app's last log lines as an annotation, which is
          # readable on the run summary without opening the full log.
          LOG=$(docker compose logs --no-color --tail 40 app | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=app container log (last 40 lines)::$LOG"

      - name: Tear down
        if: always()
        run: docker compose down -v
